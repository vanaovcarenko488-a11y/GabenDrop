<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Рулетка — Лабораторна робота №10</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    <h1 id="playerName">Гравець</h1>
    <div class="attempts" id="attemptsText"></div>

    <div class="slot-window">
      <div class="start-screen" id="startScreen">
        <img img src="case.jpg" alt="Кейс">
      </div>
      <div class="reel" id="reel"></div>
    </div>

    <button class="open-btn" id="openBtn">Відчинити</button>
    <div class="status-text" id="statusText">Натисніть кнопку, щоб почати</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
